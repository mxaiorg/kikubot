# rspamd dkim_signing — template for this repo's recommended layout
# (agents on a dedicated SUBDOMAIN such as agents.acme.com).
#
# rspamd only reads a file named exactly `dkim_signing.conf` here; this
# `-example` copy is inert until you rename it. Two ways to use it:
#
#   A. Preferred: don't copy anything. Run  ../../dkim-setup.sh <domain>
#      which generates the key, writes dkim_signing.conf, and patches it.
#
#   B. Manual: copy this file to dkim_signing.conf, replace every
#      `agents.example.com` with your agent domain, THEN run
#      `docker exec dms setup config dkim domain <domain>`. DMS sees the
#      existing file and only adds the key (it skips a domain block that is
#      already present), so the settings below survive.
#
# The one line that matters, and the reason this template exists:
#
#   use_esld = false;
#
# DMS's generator writes `use_esld = true`, which makes rspamd reduce the From:
# domain to its effective second-level domain (agents.acme.com -> acme.com)
# before looking it up in `domain {}`. With only the subdomain in the map, the
# lookup misses and rspamd SILENTLY skips signing — no error, no DNS lookup,
# just LOCAL_OUTBOUND without DKIM_SIGNED in rspamd.log.
#
# docs: https://rspamd.com/doc/modules/dkim_signing.html

enabled = true;

sign_authenticated = true;   # sign mail submitted by authenticated agents (port 587)
sign_local = true;           # sign mail originating inside the container

use_domain = "header";       # pick the key by the From: header domain
use_redis = false;           # keys live on disk, not in Redis
use_esld = false;            # REQUIRED for a subdomain — see the note above
try_fallback = false;        # no domain match => no signature (don't sign with the wrong key)

# Verifies the published TXT record matches the private key before signing.
# Leave it on: it catches DNS drift. It never decides *whether* a domain is
# looked up, so it is not the cause when nothing is signed.
check_pubkey = true;

domain {
    agents.example.com {
        path = "/tmp/docker-mailserver/rspamd/dkim/rsa-2048-mail-agents.example.com.private.txt";
        selector = "mail";
    }
}
